name: Build Sanskriti Sathi APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7 (required by Android Gradle Plugin 8.6.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Install and launch on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.sanskritisathi.app
            adb shell monkey -p com.sanskritisathi.app 1
            sleep 12
            adb shell pidof com.sanskritisathi.app
            adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|AndroidRuntime' && exit 1 || true

      - name: Get SHA fingerprints
        run: gradle signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sanskriti-Sathi-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
