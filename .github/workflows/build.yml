name: Build Sanskriti Sathi APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Run unit tests and Android lint
        run: gradle --no-daemon testDebugUnitTest lintDebug --stacktrace

      - name: Install and launch on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -wipe-data -camera-back none -memory 4096 -cores 4
          script: >-
            adb start-server && adb wait-for-device && adb shell 'test "$(getprop sys.boot_completed)" = "1"' && adb shell pm list packages >/dev/null && adb install -r -t app/build/outputs/apk/debug/app-debug.apk && adb shell am force-stop com.sanskritisathi.app && adb shell monkey -p com.sanskritisathi.app 1 && sleep 15 && adb shell pidof com.sanskritisathi.app >/dev/null && adb logcat -d -t 3000 > /tmp/sanskriti-logcat.txt && ! grep -E 'FATAL EXCEPTION|Process: com[.]sanskritisathi[.]app|Fatal signal' /tmp/sanskriti-logcat.txt && echo 'APK installed and app launch smoke test passed.'

      - name: Get SHA fingerprints
        if: success()
        run: gradle --no-daemon signingReport

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanskriti-Sathi-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
