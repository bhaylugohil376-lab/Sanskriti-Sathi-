name: Build Sanskriti Sathi APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        id: build_apk
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Run unit tests and Android lint
        run: gradle --no-daemon testDebugUnitTest lintDebug --stacktrace

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanskriti-Sathi-Lint-Report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Install and launch on Android Emulator
        if: always() && steps.build_apk.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-boot-timeout: 900
          disable-spellchecker: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -wipe-data -camera-back none -memory 4096 -cores 4
          script: gradle --no-daemon connectedDebugAndroidTest --stacktrace && bash .github/scripts/emulator-smoke-test.sh

      - name: Get SHA fingerprints
        if: always() && steps.build_apk.outcome == 'success'
        run: gradle --no-daemon signingReport

      - name: Upload APK
        if: always() && steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Sanskriti-Sathi-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
